services:
  backend:
    build: ./backend
    container_name: checloud-backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    env_file:
      - ./backend/src/.env
    environment:
      MONGO_URI: mongodb://checloud-mongodb:27017/mywebapp
    depends_on:
      - mongodb

  frontend:
    build: ./frontend/che-cloud
    container_name: checloud-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mongodb:
    image:  mongo:4.4.6
    container_name: checloud-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./backend/checloud_mongo_data:/data/db

  python-service:
    build: ../python_service/
    container_name: che-cloud-python-service
    ports:
      - "5001:5001"
    volumes:
      - python_service_data:/data

volumes:
  python_service_data:
